</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-14 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] flex items-center justify-center -ml-2 rounded-full text-on-surface hover:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex items-center gap-space-xs pl-1"><span class="font-headline-sm text-headline-sm text-primary tracking-tight font-bold">ROADSENSE</span><span class="font-label-sm text-label-sm px-1.5 py-0.5 rounded bg-surface-container-highest text-on-surface-variant uppercase tracking-wider font-semibold">Pune</span></div></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 pb-safe bg-surface"><div class="flex flex-col w-full pb-8">

<div class="flex items-center gap-2 mb-1.5">
<!-- Integrated Location-Pin & Route Glyph -->
<div class="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center shadow-md">
<svg class="w-6 h-6 text-on-primary" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="currentColor"></path>

<circle cx="12" cy="9" fill="#F59E0B" r="3.2"></circle>
<path d="M12 9L15 6" stroke="#ffffff" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</div>
<span class="font-display-lg text-display-lg font-bold text-on-surface tracking-tight">Road<span class="text-primary">Sense</span></span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium tracking-wide">Smarter routes. Every mode.</p>
</div>
</div>
<!-- Main Login Container Sheet -->
<div class="px-margin relative z-20">
<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-5 flex flex-col">
<!-- Titles -->
<div class="mb-5">
<h1 class="font-headline-lg text-headline-lg font-bold text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">Log in to plan your next trip</p>
</div>
<!-- Segmented Pill Switcher -->
<div class="bg-surface-container-low p-1 rounded-xl flex items-center justify-between mb-5 select-none">
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center bg-surface-container-lowest text-primary shadow-xs font-semibold" id="tab-phone" onclick="switchLoginTab('phone')" type="button">
          Phone
        </button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center text-on-surface-variant font-semibold" id="tab-email" onclick="switchLoginTab('email')" type="button">
          Email
        </button>
</div>
<!-- Tab View: Phone (Default) -->
<form class="flex flex-col space-y-4" id="view-phone" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="phone-input">Mobile Number</label>
<div class="flex items-center gap-2">
<!-- Indian Flag & Code Box -->
<div class="h-12 px-3 bg-surface-container-low rounded-xl flex items-center gap-1.5 select-none shrink-0">
<span class="text-base leading-none">🇮🇳</span>
<span class="font-data-time text-data-time text-on-surface font-semibold">+91</span>
</div>
<!-- 10-Digit Input -->
<div class="relative flex-1">
<input class="w-full h-12 px-3.5 bg-surface-container-low rounded-xl text-on-surface font-data-time text-data-time placeholder:text-outline/60 focus:bg-surface-container-lowest focus:outline-2 focus:outline-primary transition-all" id="phone-input" inputmode="numeric" maxlength="10" placeholder="98220 12345" type="tel">
</div>
</div>
<div class="flex items-center gap-1.5 px-0.5 pt-0.5 text-on-surface-variant font-body-sm text-body-sm">
<span class="material-symbols-outlined text-[14px] text-primary">verified_user</span>
<span class="">Instant OTP verification via SMS / WhatsApp</span>
</div>
</div>
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-semibold shadow-sm flex items-center justify-center gap-2 active:bg-on-primary-fixed-variant transition-colors mt-2" type="submit">
<span class="">Send OTP</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Tab View: Email (Toggled via JS) -->
<form class="hidden flex-col space-y-4" id="view-email" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="email-input">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-10 pr-3.5 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md placeholder:text-outline/60 focus:bg-surface-container-lowest focus:outline-2 focus:outline-primary transition-all" id="email-input" placeholder="name@example.com" type="email">
</div>
</div>
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="password-input">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-10 pr-11 bg-surface-container-low rounded-xl text-on-surface font-body-md text-body-md placeholder:text-outline/60 focus:bg-surface-container-lowest focus:outline-2 focus:outline-primary transition-all" id="password-input" placeholder="••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2.5 w-8 h-8 flex items-center justify-center rounded-lg text-outline active:text-on-surface" id="toggle-pwd" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility_off</span>
</button>
</div>
<div class="flex justify-end pt-0.5">
<button class="font-label-md text-label-md text-primary font-semibold hover:underline" type="button">Forgot password?</button>
</div>
</div>
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg font-semibold shadow-sm flex items-center justify-center gap-2 active:bg-on-primary-fixed-variant transition-colors mt-2" type="submit">
<span class="">Log in</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Soft Centered Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-surface-container-high"></div>
</div>
<span class="relative px-3 bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or continue with</span>
</div>
<!-- Google Sign In Button -->
<button class="w-full h-12 rounded-xl bg-surface-container-low active:bg-surface-container text-on-surface font-label-lg text-label-lg font-medium flex items-center justify-center gap-3 transition-colors" type="button">
<!-- Official Google Multicolor SVG -->
<svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<!-- Bottom Sign Up Redirection -->
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          New to RoadSense? 
          <button class="text-primary font-semibold hover:underline ml-0.5" type="button">Sign up</button>
</p>
</div>
</div>
<!-- Urban Transit Micro Coverage Footer Banner -->
<div class="mt-4 px-3 py-2.5 rounded-xl bg-surface-container flex items-center justify-center gap-2 text-center">
<span class="w-2 h-2 rounded-full bg-primary shrink-0 animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Supporting Pune Metro, PMPML, Suburban Rail &amp; Auto Corridors</span>
</div>
</div>
</div>
<script>
  function switchLoginTab(tab) {
    const phoneBtn = document.getElementById('tab-phone');
    const emailBtn = document.getElementById('tab-email');
    const phoneView = document.getElementById('view-phone');
    const emailView = document.getElementById('view-email');

    if (tab === 'phone') {
      phoneBtn.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center bg-surface-container-lowest text-primary shadow-xs font-semibold';
      emailBtn.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center text-on-surface-variant font-semibold';
      phoneView.classList.remove('hidden');
      emailView.classList.add('hidden');
      document.getElementById('phone-input').focus();
    } else {
      emailBtn.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center bg-surface-container-lowest text-primary shadow-xs font-semibold';
      phoneBtn.className = 'flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-center text-on-surface-variant font-semibold';
      emailView.classList.remove('hidden');
      phoneView.classList.add('hidden');
      document.getElementById('email-input').focus();
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const pwdIcon = document.getElementById('pwd-icon');
    if (!pwdInput || !pwdIcon) return;

    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility_off';
    }
  }
</script></main>

</body></html>
